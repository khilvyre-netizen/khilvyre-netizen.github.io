<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>khilvyre — Developer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #ffffff;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 40px 28px;
            text-align: center;
            border: 1px solid #26345c;
            border-radius: 20px;
            background: #11182d;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: linear-gradient(135deg, #22d3ee, #8b5cf6);
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .developer {
            margin: 0 0 28px;
            color: #aeb9d6;
            font-size: 16px;
        }

        .email {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 10px;
            background: #1b2645;
            color: #ffffff;
            text-decoration: none;
        }

        .email:hover {
            background: #26345c;
        }

        footer {
            margin-top: 32px;
            color: #7482a8;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="card">
        <div class="logo">K</div>

        <h1>khilvyre</h1>

        <p class="developer">
            Independent Android App Developer
        </p>

        <a class="email" href="mailto:khilvyre@gmail.com">
            khilvyre@gmail.com
        </a>

        <footer>
            © 2026 khilvyre. All rights reserved.
        </footer>
    </main>

</body>
</html>
